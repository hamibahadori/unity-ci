# unity-ci — GitHub Actions
#
# The same checks as .gitlab-ci.yml, for projects hosted on GitHub. Neither needs Unity, a licence,
# or account credentials. See README.md.
#
# Pull-request-only by default, matching the GitLab version. Add `push:` if you want it on every
# commit — on GitHub's free tier public repositories have unlimited minutes, so that is cheaper
# here than it is on GitLab.

name: unity-ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same PR supersedes the running workflow.
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the checks live, relative to the repository root. Leave blank to auto-detect the usual
  # layouts: copied to ci/checks, added as a submodule at ci/unity-ci/checks, or this repository
  # itself. Set it only if you put them somewhere unusual.
  UNITY_CI_CHECKS: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # These checks read git metadata, never LFS content — do not pull every binary.
          lfs: false
          # check_lfs.py and check_unity_assets.py inspect the committed tree, so a shallow clone
          # of the tip is enough, but the default depth of 1 is fine only because they use HEAD.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git-lfs
          git lfs install --skip-smudge

      - name: Install typos
        env:
          TYPOS_VERSION: 1.29.4
        run: |
          curl -sSfL \
            "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz ./typos

      - name: Locate the checks
        id: checks
        run: |
          for candidate in "$UNITY_CI_CHECKS" ci/checks ci/unity-ci/checks checks; do
            if [ -n "$candidate" ] && [ -f "$candidate/check_naming.py" ]; then
              echo "dir=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using checks in '$candidate'"
              exit 0
            fi
          done
          echo "Could not find the unity-ci checks. Set UNITY_CI_CHECKS to their directory." >&2
          exit 1

      # One step, so every check reports before the job fails and one push surfaces every problem.
      - name: Run checks
        env:
          CHECKS: ${{ steps.checks.outputs.dir }}
        run: |
          overall_status=0

          run_check() {
            label="$1"
            shift
            echo ""
            echo "=== ${label} ==================================================="
            if ! "$@"; then
              overall_status=1
            fi
          }

          run_check "core purity"         python "$CHECKS/check_core_purity.py"
          run_check "naming conventions"  python "$CHECKS/check_naming.py"
          run_check "unity asset hygiene" python "$CHECKS/check_unity_assets.py"
          run_check "lfs hygiene"         python "$CHECKS/check_lfs.py"
          run_check "typos"               ./typos

          echo ""
          exit "$overall_status"

  # unity-ci validating itself. Skips in a consuming project, which has no tests/ directory of
  # ours — the checks are the deliverable there, not the thing under test.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Look for the self-test
        id: detect
        run: |
          if [ -f tests/run_self_test.py ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No tests/run_self_test.py — this is a consuming project, nothing to self-test."
          fi

      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Proves each check passes a clean fixture AND fails a broken one. The second half is the
      # point: a check that can no longer fail still reports green and looks like coverage.
      - name: Fixture self-test
        if: steps.detect.outputs.found == 'true'
        run: python tests/run_self_test.py

      # Catches the class of bug that shipped a broken workflow here: `hashFiles` used in a
      # job-level `if`, which is valid YAML and invalid to Actions. A YAML parser cannot see it.
      - name: Install actionlint
        if: steps.detect.outputs.found == 'true'
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint the workflows
        if: steps.detect.outputs.found == 'true'
        run: ./actionlint -color

  # Skips itself until an engine-free test project exists, so this file is harmless to copy in
  # before you have one — and harmless in this repository, which has no Unity project of its own.
  core-tests:
    runs-on: ubuntu-latest
    env:
      # Point this at your test project.
      TEST_PROJECT: dotnet/YourGame.Core.Tests/YourGame.Core.Tests.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The "is this configured yet?" test has to be a step, not a job-level `if`.
      # jobs.<id>.if allows only always/cancelled/success/failure — no hashFiles, no env — because
      # it is evaluated before the job reaches a runner, so there is no workspace to inspect.
      - name: Look for an engine-free test project
        id: detect
        run: |
          if [ -f "$TEST_PROJECT" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No test project at '$TEST_PROJECT' — skipping."
            echo "Set TEST_PROJECT once you have one. See README.md."
          fi

      - if: steps.detect.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        if: steps.detect.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles(env.TEST_PROJECT) }}
          restore-keys: nuget-

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: dotnet test "$TEST_PROJECT" --logger "trx;LogFileName=core-tests.trx"

      - name: Publish results
        # Runs even when tests fail — that is when the report matters most.
        if: always() && steps.detect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: '**/core-tests.trx'
          retention-days: 7
